spring.datasource.url=jdbc:postgresql://localhost:5432/special-clinicas
spring.datasource.username=postgres
spring.datasource.password=tuContraseña
spring.datasource.hikari.connection-timeout = 100000 
#maximum number of milliseconds that a client will wait for a connection
spring.datasource.hikari.minimum-idle= 2
#minimum number of idle connections maintained by HikariCP in a connection pool
spring.datasource.hikari.maximum-pool-size= 2
#maximum pool size
spring.datasource.hikari.idle-timeout= 40000 
#maximum idle time for connection
spring.datasource.hikari.max-lifetime= 100000 
# maximum lifetime in milliseconds of a connection in the pool after it is closed.
spring.datasource.hikari.auto-commit =true 
#default auto-commit behavior.


#Keycloak Configuration
#keycloak.auth-server-url=http://52.15.157.216:8080
#keycloak.auth-server-url=http://3.135.107.87:8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/empresa
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=warehouse
keycloak.resource=warehouse-front
#keycloak.resource=lks-core-demo
keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.cors= true
keycloak.cors-max-age= 0
keycloak.cors-allowed-methods=*
#keycloak.cors-allowed-headers= X-Requested-With, Content-Type, Authorization, Origin, Accept, Access-Control-Request-Method, Access-Control-Request-Headers
keycloak.cors-allowed-headers=*
spring.main.allow-circular-references=true
keycloak.ssl-required=none


varKeycloak.url.login = http://localhost:8080/realms/warehouse/protocol/openid-connect/token
varKeycloak.grant_type = password
varKeycloak.client_id = warehouse-front
varKeycloak.refresh_token = refresh_token


